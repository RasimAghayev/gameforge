syntax = "proto3";

package gamification;

service GamificationService {
  rpc RegisterPlayer(RegisterPlayerRequest) returns (RegisterPlayerResponse);
  rpc AwardPoints(AwardPointsRequest) returns (AwardPointsResponse);
}

message RegisterPlayerRequest {
  string tenant_id = 1;
  string external_id = 2;
}

message RegisterPlayerResponse {
  string player_id = 1;
}

message AwardPointsRequest {
  string tenant_id = 1;
  string player_id = 2;
  int64 amount = 3;
  string reason = 4;
}

message AwardPointsResponse {
  bool ok = 1;
}
